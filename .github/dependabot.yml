version: 2

# Every entry has a cooldown: a new release is only proposed after it has
# been public for a few days, so a malicious or broken release is usually
# found and pulled before it reaches this project. Bigger jumps wait longer.
# The shortest wait anywhere is 3 days.

updates:
  # GitHub Actions used by the workflows (pinned to commit SHAs; Dependabot
  # bumps the SHA and the version comment together).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # PHP dependencies (composer.json).
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10
    groups:
      composer-dev:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: deps
      prefix-development: deps-dev

  # Asset build tooling (Tailwind CLI).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm:
        patterns: ['*']
    commit-message:
      prefix: deps-dev
